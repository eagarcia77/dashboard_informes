name: Publicar Portal UCAN en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio
        run: |
          touch .nojekyll
          test -f index.html
          test -f Informe_Desarrollo_Cursos/ucan_course_development_dashboard.html
          test -f Informe_anual/ucan_annual_dashboard.html
          test -f Informa_mensual/ucan_mensual_dashboard.html

      - name: Cargar sitio como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar en GitHub Pages
        uses: actions/deploy-pages@v4
